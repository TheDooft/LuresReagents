name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Syntax check
        run: |
          for file in *.lua tests/*.lua; do
            lua5.4 -e "local _, err = loadfile('$file'); if err then io.stderr:write(err, '\n') os.exit(1) end" || exit 1
          done

      - name: Run tests
        run: lua5.4 tests/run.lua
