name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the packager can build the changelog from the tags.
          fetch-depth: 0

      # The TOC carries a literal version so it shows in the in-game addon list.
      # That can drift from the tag, and a release whose zip disagrees with the
      # addon list is worse than no release, so fail loudly instead.
      - name: Tag matches the TOC version
        run: |
          toc=$(sed -n 's/^## Version:[[:space:]]*//p' LuresReagents.toc | tr -d '\r')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$toc" != "$tag" ]; then
            echo "::error::TOC version '$toc' does not match tag '$GITHUB_REF_NAME'. Run tools/Set-Version.ps1 $tag."
            exit 1
          fi
          echo "Both at $tag."

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Set the CurseForge project id in the repository variables once the
          # project exists, then this step uploads there too. Until then the
          # packager just attaches the zip to the GitHub release.
        with:
          args: ${{ vars.CF_PROJECT_ID && format('-p {0}', vars.CF_PROJECT_ID) || '' }}
