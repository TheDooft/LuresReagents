name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the packager can fall back to a commit changelog.
          fetch-depth: 0

      # The TOC carries a literal version so it shows in the in-game addon list.
      # That can drift from the tag, and a release whose zip disagrees with the
      # addon list is worse than no release, so fail loudly instead.
      - name: Tag matches the TOC version
        run: |
          toc=$(sed -n 's/^## Version:[[:space:]]*//p' LuresReagents.toc | tr -d '\r')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$toc" != "$tag" ]; then
            echo "::error::TOC version '$toc' does not match tag '$GITHUB_REF_NAME'. Run tools/Set-Version.ps1 $tag."
            exit 1
          fi
          echo "Both at $tag."

      # Take just this version's section out of CHANGELOG.md. .pkgmeta points the
      # packager at the result, so the release page carries its own notes rather
      # than the entire history.
      - name: Changelog for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## v$version" '
            $0 == heading { found = 1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > CHANGELOG-release.md

          if [ ! -s CHANGELOG-release.md ]; then
            echo "::warning::No '## v$version' section in CHANGELOG.md; falling back to the commit log."
            rm -f CHANGELOG-release.md
          else
            cat CHANGELOG-release.md
          fi

      # Uploads to CurseForge once the TOC carries ## X-Curse-Project-ID and the
      # CF_API_KEY secret exists. Without either, it just builds the zip and
      # attaches it to the GitHub release.
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
